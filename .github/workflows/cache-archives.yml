# Step status guard: success() || failure() overrides implicit success() gating,
# allowing eligible steps after success or failure; it is false when cancelled.
# Existing input/platform/prerequisite predicates still apply. This guard does not
# change workflow concurrency or aggregate failures; failure reporting is separate.
# https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-cancellation
name: Archive cache (reusable)
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: refresh
      cache_writer:
        type: boolean
        default: false
    outputs:
      archive_cache_key:
        description: Content-addressed Actions cache key for installation consumers
        value: ${{ jobs.mods.outputs.archive_cache_key }}
permissions:
  contents: read
env:
  CACHE_WRITER: ${{ inputs.cache_writer }}
  # Disjoint producer namespaces prevent same-run renewal from reusing orphan refresh packs.
  ARTSTORE_NAME_SUFFIX: ${{ inputs.mode }}
jobs:
  mods:
    if: ${{ inputs.mode == 'refresh' }}
    continue-on-error: true  # a stale archive cache must never block the install lanes
    concurrency:
      group: mod-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A job-level block replaces the top-level one, so contents: read is repeated. actions: write
    # is only for the prune step (gh cache delete). It also covers the artifact-store reads here;
    # artifact cleanup planning has its own job (artstore-refresh).
    permissions:
      contents: read
      actions: write
    outputs:
      # Content-addressed key of the archive cache this run computed; a non-writer run does not save it, and
      # the lanes then restore the newest mod-archives-* entry.
      archive_cache_key: ${{ steps.archive_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        id: archive_source
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false
      - name: Free disk space
        id: archive_disk
        if: ${{ success() || failure() }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Restore mod archive cache
        id: archive_restore
        if: ${{ success() || failure() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: mod-archives-
          restore-keys: mod-archives-
      - name: Install archive tools
        id: archive_tools
        if: ${{ success() || failure() }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      # Optional bucket maintenance runs on schedule/manual dispatch, outside the push
      # install critical path. Required archive refresh below still reads R2 as a fallback.
      # Keep this inside the existing writer lock; do not introduce overlapping bucket writers.
      - name: Refresh the R2 bucket (optional)
        if: ${{ (success() || failure()) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.archive_source.outcome == 'success' && steps.archive_disk.outcome == 'success' && steps.archive_restore.outcome == 'success' && steps.archive_tools.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 40
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: python tools/modsync-ci/refresh_archives.py --max-items 500
      # Revalidates every archive (conditional request), downloads only new or changed ones
      # (artifact store, P2P, then the optional bucket, then the website) and keeps what fits the 10 GB
      # repository cache. GITHUB_TOKEN switches the artifact-store tier on; --emit-stage-manifest lists
      # the cached objects the store lacks or will soon expire, for the publish steps at the end.
      - name: Refresh the mod archive cache
        if: ${{ (success() || failure()) && (steps.archive_source.outcome == 'success' && steps.archive_disk.outcome == 'success' && steps.archive_restore.outcome == 'success' && steps.archive_tools.outcome == 'success') }}
        id: refresh
        continue-on-error: true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          status=0
          python tools/modsync-ci/cache.py refresh --cache-dir "$RUNNER_TEMP/mod-cache" \
            --cache-limit-bytes 2684354560 --emit-stage-manifest "$RUNNER_TEMP/stage-manifest.json" \
            --stage-max-bytes 3221225472 --stage-total-bytes 9663676416 \
            "${remote[@]}" > "$RUNNER_TEMP/refresh-report.json" || status=$?
          python -c 'import collections,json,sys; print(dict(collections.Counter(e.get("status") for e in json.load(open(sys.argv[1]))["entries"])))' "$RUNNER_TEMP/refresh-report.json" || true
          exit "$status"
      # The key is a hash of manifest.json without its per-run timestamps (checked_at, imported_at), so
      # unchanged content gives an unchanged key and no new entry. Empty when there is no manifest.
      - name: Compute the archive cache key
        id: archive_key
        if: ${{ (success() || failure()) && (always()) }}
        run: |
          manifest="$RUNNER_TEMP/mod-cache/manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "No manifest.json in the mod cache; nothing to save."
            exit 0
          fi
          digest=$(python3 - "$manifest" <<'PY'
          import hashlib, json, sys
          volatile = {"checked_at", "imported_at"}
          def strip(value):
              if isinstance(value, dict):
                  return {key: strip(item) for key, item in value.items() if key not in volatile}
              if isinstance(value, list):
                  return [strip(item) for item in value]
              return value
          with open(sys.argv[1], encoding="utf-8") as stream:
              document = strip(json.load(stream))
          canonical = json.dumps(document, sort_keys=True, separators=(",", ":"))
          print(hashlib.sha256(canonical.encode("utf-8")).hexdigest()[:16])
          PY
          )
          echo "key=mod-archives-$digest" >> "$GITHUB_OUTPUT"
      - name: Look up the archive cache entry
        id: archive_exists
        if: ${{ (success() || failure()) && (always() && steps.archive_key.outputs.key != '') }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ steps.archive_key.outputs.key }}
          lookup-only: true
      # Entries are immutable. An existing key is skipped here; if two runs race for it, the save
      # action logs "Failed to save: Unable to reserve cache ... another job may be creating this
      # cache" at info level, which is not an error.
      - name: Save mod archive cache
        id: archive_save
        if: ${{ (success() || failure()) && (always() && env.CACHE_WRITER == 'true' && steps.archive_key.outputs.key != '' && steps.archive_exists.outputs.cache-hit != 'true') && (steps.archive_restore.outcome == 'success' && steps.refresh.outcome == 'success' && steps.archive_key.outcome == 'success') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ steps.archive_key.outputs.key }}
      # Keeps one mod-archives-* entry so the repository stays under the 10 GB Actions cache cap.
      # Only runs once the current key is confirmed present, and only touches mod-archives-* keys,
      # never game-* or steam-sealed-*.
      - name: Prune stale mod archive caches
        if: ${{ (success() || failure()) && (always() && env.CACHE_WRITER == 'true' && steps.archive_key.outputs.key != '' && (steps.archive_save.outcome == 'success' || steps.archive_exists.outputs.cache-hit == 'true')) && (steps.archive_restore.outcome == 'success' && steps.refresh.outcome == 'success' && steps.archive_key.outcome == 'success') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_KEY: ${{ steps.archive_key.outputs.key }}
        run: |
          mapfile -t keys < <(gh cache list --key mod-archives- --limit 100 --json key --jq '.[].key' | sort -u)
          if ! printf '%s\n' "${keys[@]}" | grep -Fxq -- "$CURRENT_KEY"; then
            echo "::warning::$CURRENT_KEY is not in the cache list; leaving every mod archive cache in place."
            exit 0
          fi
          for key in "${keys[@]}"; do
            [[ "$key" == mod-archives-* && "$key" != "$CURRENT_KEY" ]] || continue
            echo "Deleting stale cache $key"
            gh cache delete "$key"
          done
      # Retired: explicit false guards stop every publisher; recovery reads remain enabled.
      # Publishes cached objects the artifact store lacks (or will soon expire) as sealed pack artifacts
      # plus an index fragment. Never on pull requests. A failure here only warns; it never fails the job.
      # The 3 GiB pack budget keeps the 2.5 GiB cache in one pack; the three upload slots are headroom.
      - name: Stage artifact store packs
        id: stage
        if: ${{ false && (success() || failure()) && (always() && contains(fromJSON('["push","schedule","release","workflow_dispatch"]'), github.event_name)) && (steps.refresh.outcome == 'success') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/stage-manifest.json"
          if [[ -z "$CACHE_ENCRYPTION_KEY" ]]; then
            echo "::notice::CACHE_ENCRYPTION_KEY is empty; not publishing to the artifact store."
            exit 0
          fi
          if [[ ! -s "$manifest" ]]; then
            echo "No stage manifest; nothing to publish to the artifact store."
            exit 0
          fi
          if ! python tools/modsync-ci/artstore.py stage --manifest-json "$manifest" \
              --packdir "$RUNNER_TEMP/artstore-pack" --pack-budget 3221225472 > "$RUNNER_TEMP/artstore-stage.json"; then
            echo "::error::Artifact store staging failed; nothing was published this run."
            exit 1
          fi
          python3 - "$RUNNER_TEMP/artstore-stage.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              summary = json.load(stream)
          packs = summary.get("packs") or []
          if len(packs) > 3:
              print("::warning::Artifact store staged %d packs; only the first 3 are uploaded, the rest are staged again next run." % len(packs), file=sys.stderr)
          for slot in range(3):
              print("pack%d=%s" % (slot + 1, os.path.basename(packs[slot]["dir"]) if slot < len(packs) else ""))
          print("index=%s" % ((summary.get("index_name") or "") if packs else ""))
          PY
      - name: Upload artifact store pack 1
        id: up1
        if: ${{ false && (success() || failure()) && (always() && steps.stage.outputs.pack1 != '') && (steps.stage.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack1 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack1 }}
          if-exists: fail
      - name: Upload artifact store pack 2
        id: up2
        if: ${{ false && (success() || failure()) && (always() && steps.stage.outputs.pack2 != '') && (steps.stage.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack2 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack2 }}
          if-exists: fail
      - name: Upload artifact store pack 3
        id: up3
        if: ${{ false && (success() || failure()) && (always() && steps.stage.outputs.pack3 != '') && (steps.stage.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack3 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack3 }}
          if-exists: fail
      # Publish the index only after every staged pack has an uploaded artifact ID.
      # Existing names fail closed; never adopt an unverified same-name artifact.
      - name: Upload artifact store index
        id: upindex
        if: ${{ false && (success() || failure()) && (always() && steps.stage.outputs.index != '' && (steps.up1.outcome == 'success' || steps.up2.outcome == 'success' || steps.up3.outcome == 'success')) && (steps.stage.outcome == 'success' && (steps.stage.outputs.pack1 == '' || (steps.up1.outcome == 'success' && steps.up1.outputs.artifact-id != '')) && (steps.stage.outputs.pack2 == '' || (steps.up2.outcome == 'success' && steps.up2.outputs.artifact-id != '')) && (steps.stage.outputs.pack3 == '' || (steps.up3.outcome == 'success' && steps.up3.outputs.artifact-id != ''))) }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.index }}
          directory: ${{ runner.temp }}/artstore-pack/index
          if-exists: fail
      - name: Report artifact store publish problems
        if: ${{ (success() || failure()) && (always() && (steps.stage.outcome == 'failure' || steps.up1.outcome == 'failure' || steps.up2.outcome == 'failure' || steps.up3.outcome == 'failure' || steps.upindex.outcome == 'failure' || (steps.stage.outputs.index != '' && (steps.upindex.outcome != 'success' || steps.upindex.outputs.artifact-id == '')))) }}
        run: echo "::error::Artifact store publish failed; the install lanes fall back to the other archive sources."
      # Read-path proof from a real runner: fetch the smallest blob just published (or, when nothing was
      # published this run, the smallest blob in `artstore.py list`) back through the store and compare its
      # SHA-256. A failure fails the (non-blocking) job in the last step.
      - name: Verify artifact store round trip
        id: roundtrip
        if: ${{ (success() || failure()) && (always() && contains(fromJSON('["push","schedule","release","workflow_dispatch"]'), github.event_name)) }}
        continue-on-error: true
        env:
          INDEX_PUBLISHED: ${{ steps.upindex.outcome == 'success' && steps.upindex.outputs.artifact-id != '' }}
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$CACHE_ENCRYPTION_KEY" ]]; then
            echo "::notice::CACHE_ENCRYPTION_KEY is empty; skipping the artifact store round trip."
            exit 0
          fi
          trap 'rm -rf "$RUNNER_TEMP/artstore-roundtrip"' EXIT
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys, time

          temp = os.environ["RUNNER_TEMP"]
          tool = "tools/modsync-ci/artstore.py"
          sha_re = re.compile(r"^[0-9a-f]{64}$")
          units = {"B": 1, "KiB": 1024, "MiB": 1024 ** 2, "GiB": 1024 ** 3}

          def summary(line):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write(line + "\n")

          def fail(reason):
              print("::error::artstore round trip FAILED: %s" % reason, flush=True)
              summary("artstore round trip FAILED: %s" % reason)
              sys.exit(1)

          def pick_published():
              try:
                  with open(os.path.join(temp, "artstore-stage.json"), encoding="utf-8") as stream:
                      staged = json.load(stream).get("staged") or []
                  with open(os.path.join(temp, "stage-manifest.json"), encoding="utf-8") as stream:
                      paths = {entry["sha256"]: entry["path"] for entry in json.load(stream)}
              except (OSError, ValueError, KeyError, TypeError):
                  return None
              sizes = {sha: os.path.getsize(paths[sha]) for sha in staged
                       if sha in paths and os.path.isfile(paths[sha])}
              if not sizes:
                  return None
              sha = min(sizes, key=lambda item: (sizes[item], item))
              return sha, "published"

          def pick_listed():
              listing = subprocess.run([sys.executable, tool, "list"], stdout=subprocess.PIPE, text=True)
              if listing.returncode != 0:
                  fail("artstore list exited %d" % listing.returncode)
              best = None
              for line in listing.stdout.splitlines():
                  cols = line.split()
                  if len(cols) < 6 or not sha_re.match(cols[0]) or cols[-1] == "expired":
                      continue
                  try:
                      size = float(cols[1]) * units[cols[2]]
                  except (ValueError, KeyError):
                      continue
                  if best is None or (size, cols[0]) < best[0]:
                      best = ((size, cols[0]), cols[0])
              return (best[1], "listed") if best else None

          # Staged is not published: quota/upload failures must probe the existing store.
          picked = (pick_published() if os.environ.get("INDEX_PUBLISHED") == "true" else None) or pick_listed()
          if picked is None:
              print("::notice::The artifact store lists no blobs and nothing was published; no round trip to verify.")
              summary("artstore round trip skipped: the store holds no blobs")
              sys.exit(0)
          sha, source = picked

          workdir = os.path.join(temp, "artstore-roundtrip")
          os.makedirs(workdir, exist_ok=True)
          dest = os.path.join(workdir, "blob")
          for attempt in range(1, 4):
              if os.path.exists(dest):
                  os.remove(dest)
              start = time.monotonic()
              code = subprocess.run([sys.executable, tool, "fetch", "--sha256", sha, "--dest", dest,
                                     "--workdir", workdir]).returncode
              elapsed = time.monotonic() - start
              if code != 3 or attempt == 3:
                  break
              time.sleep(20)
          if code != 0:
              fail("fetch of %s blob %s %s (exit %d)" % (source, sha[:12], "missed" if code == 3 else "failed", code))

          digest = hashlib.sha256()
          size = 0
          with open(dest, "rb") as stream:
              for chunk in iter(lambda: stream.read(1 << 20), b""):
                  digest.update(chunk)
                  size += len(chunk)
          if digest.hexdigest() != sha:
              fail("sha256 mismatch for %s blob %s" % (source, sha[:12]))
          line = "artstore round trip OK: %s %d bytes in %.1fs (%s blob)" % (sha[:12], size, elapsed, source)
          print(line, flush=True)
          summary(line)
          PY
      # The refresh, publish and round-trip steps continue on error so the cache is still saved and the rest
      # still runs. The job is non-blocking (job-level continue-on-error) but must still show red when one failed.
      - name: Fail when the refresh, publish or round trip failed
        if: ${{ (success() || failure()) && (always() && (steps.refresh.outcome == 'failure' || steps.stage.outcome == 'failure' || steps.up1.outcome == 'failure' || steps.up2.outcome == 'failure' || steps.up3.outcome == 'failure' || steps.upindex.outcome == 'failure' || (steps.stage.outputs.index != '' && (steps.upindex.outcome != 'success' || steps.upindex.outputs.artifact-id == '')) || steps.roundtrip.outcome == 'failure')) }}
        run: |
          echo "::error::mods: the archive cache refresh, artifact store publish or round trip failed; see the failed step above."
          exit 1

  # Scheduled and manual only. Blobs whose artifact-store retention ends within 21 days are fetched,
  # sealed again into a new pack with a new index fragment, then a read-only cleanup plan is produced. This is the only job (besides mods, for its cache deletes) with actions: write. It runs after
  # mods and in the same concurrency group, so two index writers never overlap.
  artstore-refresh:
    name: artstore refresh
    # Retired publication/renewal: retain recovery readers and existing artifacts.
    if: ${{ false && !cancelled() && inputs.mode == 'renew' }}
    concurrency:
      group: mod-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        id: renewal_source
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false
      - name: Free disk space
        id: renewal_disk
        if: ${{ success() || failure() }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Plan the refresh
        id: plan
        if: ${{ (success() || failure()) && (steps.renewal_source.outcome == 'success' && steps.renewal_disk.outcome == 'success') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/artstore.py refresh-plan --within-days 21 > "$RUNNER_TEMP/refresh-plan.txt"
      # At most 8 GiB per run; what is left stays in the plan for the next scheduled run.
      - name: Fetch the blobs that are about to expire
        if: ${{ (success() || failure()) && (steps.plan.outcome == 'success') }}
        id: fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/artstore-refresh"
          mkdir -p "$root/blobs" "$root/work"
          : > "$root/list.tsv"
          total=0
          planned=0
          failed=0
          cap=8589934592
          while read -r sha; do
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || continue
            planned=$((planned + 1))
            if (( total >= cap )); then
              echo "::notice::Refresh byte cap reached; the next run takes the rest."
              break
            fi
            if python tools/modsync-ci/artstore.py fetch --sha256 "$sha" --dest "$root/blobs/$sha" --workdir "$root/work" > /dev/null; then
              total=$((total + $(stat -c %s "$root/blobs/$sha")))
              printf '%s\t%s\n' "$root/blobs/$sha" "$sha" >> "$root/list.tsv"
            else
              echo "::error::Could not fetch blob ${sha:0:12} from the artifact store; it is not renewed."
              failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/refresh-plan.txt"
          python3 - "$root/list.tsv" "$root/manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              pairs = [line.rstrip("\n").split("\t") for line in stream if line.strip()]
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              json.dump([{"path": path, "sha256": sha256} for path, sha256 in pairs], stream)
          PY
          echo "count=$(wc -l < "$root/list.tsv")" >> "$GITHUB_OUTPUT"
          echo "planned=$planned" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Stage artifact store packs
        id: stage
        if: ${{ false && (success() || failure()) && (steps.fetch.outputs.count != '0') && (steps.fetch.outcome == 'success' && steps.fetch.outputs.failed == '0' && steps.fetch.outputs.count != '' && steps.fetch.outputs.count > 0) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if ! python tools/modsync-ci/artstore.py stage --manifest-json "$RUNNER_TEMP/artstore-refresh/manifest.json" \
              --packdir "$RUNNER_TEMP/artstore-pack" --pack-budget 3221225472 > "$RUNNER_TEMP/artstore-stage.json"; then
            echo "::error::Artifact store staging failed; nothing was refreshed this run."
            exit 1
          fi
          python3 - "$RUNNER_TEMP/artstore-stage.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              summary = json.load(stream)
          packs = summary.get("packs") or []
          if len(packs) > 3:
              print("::warning::Artifact store staged %d packs; only the first 3 are uploaded, the rest are staged again next run." % len(packs), file=sys.stderr)
          for slot in range(3):
              print("pack%d=%s" % (slot + 1, os.path.basename(packs[slot]["dir"]) if slot < len(packs) else ""))
          print("index=%s" % ((summary.get("index_name") or "") if packs else ""))
          PY
      - name: Upload artifact store pack 1
        id: up1
        if: ${{ false && (success() || failure()) && (steps.stage.outputs.pack1 != '') && (steps.stage.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack1 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack1 }}
          if-exists: fail
      - name: Upload artifact store pack 2
        id: up2
        if: ${{ false && (success() || failure()) && (steps.stage.outputs.pack2 != '') && (steps.stage.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack2 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack2 }}
          if-exists: fail
      - name: Upload artifact store pack 3
        id: up3
        if: ${{ false && (success() || failure()) && (steps.stage.outputs.pack3 != '') && (steps.stage.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack3 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack3 }}
          if-exists: fail
      - name: Upload artifact store index
        id: upindex
        if: ${{ false && (success() || failure()) && (steps.stage.outputs.index != '' && (steps.up1.outcome == 'success' || steps.up2.outcome == 'success' || steps.up3.outcome == 'success')) && (steps.stage.outcome == 'success' && (steps.stage.outputs.pack1 == '' || (steps.up1.outcome == 'success' && steps.up1.outputs.artifact-id != '')) && (steps.stage.outputs.pack2 == '' || (steps.up2.outcome == 'success' && steps.up2.outputs.artifact-id != '')) && (steps.stage.outputs.pack3 == '' || (steps.up3.outcome == 'success' && steps.up3.outputs.artifact-id != ''))) }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.index }}
          directory: ${{ runner.temp }}/artstore-pack/index
          if-exists: fail
      # Staging and uploads continue on error for diagnostics; cleanup remains a read-only plan.
      # The job itself fails here,
      # because a refresh that renewed nothing it planned to renew has not done its job.
      - name: Fail when expiring blobs were not renewed
        if: ${{ (success() || failure()) && (steps.fetch.outputs.failed != '0' || steps.stage.outcome == 'failure' || steps.up1.outcome == 'failure' || steps.up2.outcome == 'failure' || steps.up3.outcome == 'failure' || steps.upindex.outcome == 'failure' || (steps.stage.outputs.index != '' && (steps.upindex.outcome != 'success' || steps.upindex.outputs.artifact-id == ''))) }}
        env:
          FAILED: ${{ steps.fetch.outputs.failed }}
          PLANNED: ${{ steps.fetch.outputs.planned }}
        run: |
          echo "::error::Artifact store refresh incomplete: $FAILED of $PLANNED planned blob(s) could not be fetched, or staging/upload failed; expiring blobs were not all renewed this run."
          exit 1
      - name: Plan artifact cleanup (no deletion)
        if: ${{ (success() || failure()) && (!cancelled()) && (steps.plan.outcome == 'success' && steps.fetch.outcome == 'success' && steps.fetch.outputs.failed == '0' && steps.stage.outcome == 'success' && steps.upindex.outcome == 'success' && steps.upindex.outputs.artifact-id != '' && (steps.stage.outputs.pack1 == '' || (steps.up1.outcome == 'success' && steps.up1.outputs.artifact-id != '')) && (steps.stage.outputs.pack2 == '' || (steps.up2.outcome == 'success' && steps.up2.outputs.artifact-id != '')) && (steps.stage.outputs.pack3 == '' || (steps.up3.outcome == 'success' && steps.up3.outputs.artifact-id != ''))) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/artstore.py prune
