# Step status guard: success() || failure() overrides implicit success() gating,
# allowing eligible steps after success or failure; it is false when cancelled.
# Existing input/platform/prerequisite predicates still apply. This guard does not
# change workflow concurrency or aggregate failures; failure reporting is separate.
# https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-cancellation
name: Artifact cache toolkit checks
on:
  push:
    branches: [main]
    paths:
      - tools/private-ci/src/artifact_store.py
      - tools/private-ci/tests/test_artifact_store.py
      - .github/workflows/artifact-cache-toolkit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ success() || failure() }}
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ success() || failure() }}
        with: {python-version: '3.12'}
      - name: Test artifact-backed content addressing without credentials
        if: ${{ success() || failure() }}
        working-directory: tools/private-ci
        run: python -m unittest tests.test_artifact_store -v
