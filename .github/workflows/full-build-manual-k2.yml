# Dispatch-only K2 human-manual controller entry; calls full-build-job.yml
# with mode=manual on a self-hosted runner. Dispatch is enabled, but the controller
# intentionally blocks automated installation: a human must perform it. Separate
# from disabled Legacy JSON and the unimplemented AI manual route. No workflow
# outputs; the reusable controller owns any encrypted receipt artifacts.

name: TSL full build (manual)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform for the build
        type: choice
        options: [windows, linux, macos]
        default: windows
permissions:
  contents: read
# One run of this lane at a time; a newer dispatch waits instead of competing for the runner.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  full-build:
    uses: ./.github/workflows/full-build-job.yml
    with:
      game: k2
      mode: manual
      platform: ${{ inputs.platform }}
      implementation: manual
      runner-mode: self-hosted
    secrets:
      FULL_BUILD_CONFIG: ${{ secrets.FULL_BUILD_CONFIG }}
      PRIVATE_CI_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
      PRIVATE_CI_RECIPIENT: ${{ secrets.PRIVATE_CI_RECIPIENT }}
      CACHE_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
      CACHE_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
