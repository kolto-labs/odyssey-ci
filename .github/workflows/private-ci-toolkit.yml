# Step status guard: success() || failure() overrides implicit success() gating,
# allowing eligible steps after success or failure; it is false when cancelled.
# Existing input/platform/prerequisite predicates still apply. This guard does not
# change workflow concurrency or aggregate failures; failure reporting is separate.
# https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-cancellation
name: Private CI tooling checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/private-ci/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  credential-free-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ success() || failure() }}
        with:
          python-version: '3.12'
      - name: Check public tooling without private credentials or game files
        if: ${{ success() || failure() }}
        working-directory: tools/private-ci
        run: python -m unittest discover -s tests -v
