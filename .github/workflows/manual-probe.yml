# Disabled Legacy JSON reference probe: dispatch metadata is retained, but its
# job never executes. Formerly exercised selected reviewed JSON-plan steps on
# fresh game copies and uploaded evidence. Disabled because scripted JSON is not
# the requested manual route; the intended AI-operated route is not implemented.
# No caller or workflow outputs; existing plans and executor remain preserved.

# Step status guard: success() || failure() overrides implicit success() gating,
# allowing eligible steps after success or failure; it is false when cancelled.
# Existing input/platform/prerequisite predicates still apply. This guard does not
# change workflow concurrency or aggregate failures; failure reporting is separate.
# https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-cancellation
name: Legacy JSON reference probe (disabled)

# Evidence for the reviewed manual-lane plans, executed by manual.py itself. probe_plan.py
# derives one small probe plan per selected step from ci/<game>-manual-plan.json (that step
# and any listed prerequisites kept verbatim, every other step a reviewed probe omission;
# the ci/ plans are never written) and runs manual.py once per probe plan on a fresh copy of
# the vanilla game, so every selected step is attempted even when an earlier one fails. The
# default selection (probe_plan.py SELECTIONS) covers every TSLPatcher/HoloPatcher build in
# the plans, TSLPatcher namespace options, ConfirmMessage, LookupGameFolder=1, PlaintextLog=1
# and the K2 TSLRCM installer. Read-only: restores caches like the manual job in ci.yml but
# never saves one; uploads reports, step logs, screenshots and patcher logs (no game files).
# Disabled legacy JSON route: no automatic trigger and an unconditional job-level stop.
# Retain dispatch metadata and probe code for a future explicitly authorized re-enable.
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to probe
        type: choice
        options: [k1, k2]
        default: k1
      steps:
        description: Comma-separated plan step ids to probe instead of the default selection (PRE+STEP runs PRE first)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: manual-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Legacy JSON reference probe (${{ matrix.game }})
    if: ${{ false && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(inputs.game && format('["{0}"]', inputs.game) || '["k1","k2"]') }}
    env:
      GAME: ${{ matrix.game }}
      WINEPREFIX: /home/runner/.wine-modsync
      WINEDEBUG: '-all'
      WINEDLLOVERRIDES: 'mscoree,mshtml='
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false
      - name: Install Wine and tools, free disk space
        if: ${{ success() || failure() }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 xvfb xauth xdotool imagemagick p7zip-full >/dev/null
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Restore game cache
        if: ${{ success() || failure() }}
        id: game_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
      - name: Look up game backup artifact
        id: game_backup
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/game_backup.py status --game "$GAME"
      - name: Restore game from backup artifact
        id: game_artifact
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_backup.outputs.artifact_id != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          ARTIFACT_ID: ${{ steps.game_backup.outputs.artifact_id }}
        run: python tools/modsync-ci/game_backup.py fetch --game "$GAME" --artifact-id "$ARTIFACT_ID" --seal-dir "$RUNNER_TEMP/sealed"
      - name: Require the game
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_artifact.outputs.restored != 'true') }}
        run: echo "::error::$GAME has no game cache on this ref and no usable game-$GAME-sealed backup artifact"; exit 1
      - name: Unpack game
        if: ${{ success() || failure() }}
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game-pristine" --seal "$RUNNER_TEMP/sealed/baseline.seal"
          rm -rf "$RUNNER_TEMP/sealed"
          du -sh "$RUNNER_TEMP/game-pristine"
      - name: Install archive tools
        if: ${{ success() || failure() }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools innoextract unar poppler-utils >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable"; }
          python -m pip install --quiet gdown
      - name: Restore mod archive cache
        if: ${{ success() || failure() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: mod-archives-
          restore-keys: mod-archives-
      - name: Restore required mod archives
        if: ${{ success() || failure() }}
        # Evidence collection: a partial restore still lets the runs whose archives arrived go ahead;
        # a probe run with a missing archive is reported as blocked, and no run at all fails the job.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          mkdir -p "$RUNNER_TEMP/probe-out"
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          policy=(--allow-uncached-by-policy "Optional Install Assistant - Quicker TSLPatching::Quicker TSLPatching")
          if [[ "$GAME" == k1 ]]; then
            policy+=(--allow-uncached-by-policy "Optional Widescreen & Extended Widescreen Support Mods::Remastered Cutscenes")
          elif [[ "$GAME" == k2 ]]; then
            policy+=(--allow-uncached-by-policy "Enhanced Widescreen Support Mods::K2 Cutscenes Rescaled")
          fi
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/probe-out/archive-map.json" "${policy[@]}" "${remote[@]}"
          rm -rf "$RUNNER_TEMP/mod-cache"
      - name: Build the probe plans
        if: ${{ success() || failure() }}
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          python tools/modsync-ci/probe_plan.py build --game "$GAME" --plan "ci/$GAME-manual-plan.json" \
            --out-dir "$RUNNER_TEMP/probe-plans" --steps "$STEPS"
          cp "$RUNNER_TEMP/probe-plans/runs.json" "$RUNNER_TEMP/probe-out/runs.json"
          python tools/modsync-ci/probe_plan.py prune-archives --runs "$RUNNER_TEMP/probe-plans/runs.json" \
            --archives "$RUNNER_TEMP/archives"
          df -h "$RUNNER_TEMP"
      - name: Run the probe plans with manual.py
        if: ${{ success() || failure() }}
        run: |
          # manual.py resolves game paths case-insensitively with PyKotor (PYKOTOR_REQUIREMENT).
          python -m pip install --quiet "$(python -c 'import sys; sys.path.insert(0, "tools/modsync-ci"); import manual; print(manual.PYKOTOR_REQUIREMENT)')"
          # The plans' Browse-for-Folder actions navigate to exactly $RUNNER_TEMP/game.
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/modsync-ci/probe_plan.py run \
            --runs "$RUNNER_TEMP/probe-plans/runs.json" --guide "content/$GAME/full.md" \
            --pristine "$RUNNER_TEMP/game-pristine" --game-dir "$RUNNER_TEMP/game" \
            --archives "$RUNNER_TEMP/archives" --scratch "$RUNNER_TEMP/probe-scratch" --out "$RUNNER_TEMP/probe-out"
      - name: Upload probe output
        if: ${{ (success() || failure()) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-probe-${{ matrix.game }}
          path: ${{ runner.temp }}/probe-out
          retention-days: 14
          if-no-files-found: ignore
