name: Scoped Deadly Stream source job
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: 'both'
      runner:
        type: string
        default: 'github'
      minutes:
        type: string
        default: '25'
      bucket:
        type: string
        default: ''
      endpoint:
        type: string
        default: ''
      recipient:
        type: string
        default: ''
    secrets:
      DEADLYSTREAM_CACHE_WRITE_ACCESS_KEY_ID:
        required: true
      DEADLYSTREAM_CACHE_WRITE_SECRET_ACCESS_KEY:
        required: true
      DEADLYSTREAM_CACHE_READ_ACCESS_KEY_ID:
        required: true
      DEADLYSTREAM_CACHE_READ_SECRET_ACCESS_KEY:
        required: true
      DEADLYSTREAM_CACHE_DECRYPTION_IDENTITY:
        required: true
      DEADLYSTREAM_SESSION_COOKIES:
        required: false
permissions:
  contents: read
jobs:
  acquire:
    if: github.repository == 'kolto-labs/odyssey-ci' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'vps' && fromJSON(inputs.mode == 'authenticated' && '["self-hosted","linux","x64","deadlystream-member"]' || '["self-hosted","linux","x64","deadlystream-capture"]') || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
      - name: Select the cloud browser directory
        env:
          BROWSER_PATH: ${{ runner.environment == 'self-hosted' && '/opt/kolto-labs/deadlystream-actions/browsers' || format('{0}/pw-browsers', runner.temp) }}
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Use the isolated cloud runtime
        if: runner.environment == 'self-hosted'
        run: echo /opt/kolto-labs/deadlystream-actions/python/bin >> "$GITHUB_PATH"
      - name: Install preservation dependencies
        if: runner.environment == 'github-hosted'
        run: python -m pip install boto3==1.43.124 requests==2.34.2 beautifulsoup4==4.15.0 PySocks==1.7.1
      - name: Establish verified cloud-side source proxy
        if: inputs.mode != 'deliver'
        env:
          PRESERVATION_RUNNER_KIND: ${{ runner.environment }}
        run: bash tools/deadlystream/install-warp.sh
      - name: Install age for delivery-only runs
        if: inputs.mode == 'deliver' && runner.environment == 'github-hosted'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Install the standard browser
        if: inputs.mode == 'authenticated' && runner.environment == 'github-hosted'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          command -v xvfb-run >/dev/null || sudo apt-get install -y -qq xvfb
      - name: Capture and deliver original files
        env:
          DEADLYSTREAM_WORK_ROOT: ${{ runner.temp }}/deadlystream-preservation
          DEADLYSTREAM_CACHE_WRITE_ACCESS_KEY_ID: ${{ secrets.DEADLYSTREAM_CACHE_WRITE_ACCESS_KEY_ID }}
          DEADLYSTREAM_CACHE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.DEADLYSTREAM_CACHE_WRITE_SECRET_ACCESS_KEY }}
          DEADLYSTREAM_CACHE_READ_ACCESS_KEY_ID: ${{ secrets.DEADLYSTREAM_CACHE_READ_ACCESS_KEY_ID }}
          DEADLYSTREAM_CACHE_READ_SECRET_ACCESS_KEY: ${{ secrets.DEADLYSTREAM_CACHE_READ_SECRET_ACCESS_KEY }}
          DEADLYSTREAM_CACHE_DECRYPTION_IDENTITY: ${{ secrets.DEADLYSTREAM_CACHE_DECRYPTION_IDENTITY }}
          DEADLYSTREAM_SESSION_COOKIES: ${{ secrets.DEADLYSTREAM_SESSION_COOKIES }}
          DEADLYSTREAM_CACHE_BUCKET: ${{ inputs.bucket }}
          DEADLYSTREAM_CACHE_ENDPOINT: ${{ inputs.endpoint }}
          DEADLYSTREAM_CACHE_ENCRYPTION_RECIPIENT: ${{ inputs.recipient }}
          PRESERVATION_MODE: ${{ inputs.mode }}
          PRESERVATION_MINUTES: ${{ inputs.minutes }}
        run: |
          if [ "$PRESERVATION_MODE" = authenticated ]; then
            xvfb-run -a python tools/deadlystream/runner.py --mode "$PRESERVATION_MODE" --minutes "$PRESERVATION_MINUTES"
          else
            python tools/deadlystream/runner.py --mode "$PRESERVATION_MODE" --minutes "$PRESERVATION_MINUTES"
          fi
      - name: Remove transient credentials and plaintext workspace
        if: always()
        env:
          PRESERVATION_ROOT: ${{ runner.temp }}/deadlystream-preservation
        run: rm -rf -- "$PRESERVATION_ROOT"
