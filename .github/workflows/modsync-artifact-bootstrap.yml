name: One-time temporary Actions-read bootstrap to ModSync.rs
on:
  push:
    branches: [ci/modsync-key-bootstrap-20261114]
    paths: [.github/workflows/modsync-artifact-bootstrap.yml]
permissions: {actions: read}
jobs:
  sealed-transfer:
    if: ${{ github.repository_id == '1427366340' && github.ref == 'refs/heads/ci/modsync-key-bootstrap-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Install signed distribution crypto library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-nacl
      - name: Seal job-scoped read token directly for the fixed target Actions vault
        env:
          ORIGINAL_CACHE_KEY: ${{ github.token }}
          TARGET_PUBLIC_KEY: 's73Iv2CuEWcOdgeRw8+yvh7OO7vAEC+laU5kMJiYNkc='
          TARGET_KEY_ID: '3380204578043523366'
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/sealed-transfer"
          /usr/bin/python3 - <<'PY_KEY'
          import os, json, base64
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          secret = os.environ.pop('ORIGINAL_CACHE_KEY', '').encode()
          if len(secret) < 32:
              raise SystemExit('Scoped source token is missing')
          ciphertext = SealedBox(PublicKey(base64.b64decode(os.environ['TARGET_PUBLIC_KEY']))).encrypt(secret)
          value = {'repository': 'kolto-labs/ModSync.rs', 'repository_id': 1372329260,
                   'secret_name': 'ARTSTORE_READ_TOKEN', 'key_id': os.environ['TARGET_KEY_ID'],
                   'encrypted_value': base64.b64encode(ciphertext).decode(),
                   'source_repository': os.environ['GITHUB_REPOSITORY'],
                   'source_sha': os.environ['GITHUB_SHA'], 'source_run': os.environ['GITHUB_RUN_ID']}
          path = Path(os.environ['RUNNER_TEMP']) / 'sealed-transfer/secret.json'
          with path.open('x') as stream:
              json.dump(value, stream)
          PY_KEY
      - name: Retain GitHub-only ciphertext, never plaintext key material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modsync-actions-read-github-sealed
          path: ${{ runner.temp }}/sealed-transfer/secret.json
          retention-days: 1
          if-no-files-found: error
      - name: Keep the scoped source token alive until the migration controller cancels this job
        run: python3 -c 'import time; time.sleep(20400)'
