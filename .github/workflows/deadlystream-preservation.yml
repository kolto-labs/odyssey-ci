name: Preserve Deadly Stream to cloud
run-name: Deadly Stream ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [both, capture, deliver, probe]
        default: both
      runner:
        type: choice
        options: [github, vps]
        default: github
      minutes:
        type: string
        default: '25'
permissions:
  contents: read
concurrency:
  group: ${{ inputs.mode == 'deliver' && 'deadlystream-cloud-delivery' || inputs.mode == 'probe' && 'deadlystream-cloud-probe' || 'deadlystream-cloud-preservation' }}
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'kolto-labs/odyssey-ci' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deadlystream-source-job.yml
    with:
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      minutes: ${{ inputs.minutes }}
      bucket: ${{ vars.DEADLYSTREAM_CACHE_BUCKET }}
      endpoint: ${{ vars.DEADLYSTREAM_CACHE_ENDPOINT }}
      recipient: ${{ vars.DEADLYSTREAM_CACHE_ENCRYPTION_RECIPIENT }}
    secrets:
      DEADLYSTREAM_CACHE_WRITE_ACCESS_KEY_ID: ${{ secrets.DEADLYSTREAM_CACHE_WRITE_ACCESS_KEY_ID }}
      DEADLYSTREAM_CACHE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.DEADLYSTREAM_CACHE_WRITE_SECRET_ACCESS_KEY }}
      DEADLYSTREAM_CACHE_READ_ACCESS_KEY_ID: ${{ secrets.DEADLYSTREAM_CACHE_READ_ACCESS_KEY_ID }}
      DEADLYSTREAM_CACHE_READ_SECRET_ACCESS_KEY: ${{ secrets.DEADLYSTREAM_CACHE_READ_SECRET_ACCESS_KEY }}
      DEADLYSTREAM_CACHE_DECRYPTION_IDENTITY: ${{ secrets.DEADLYSTREAM_CACHE_DECRYPTION_IDENTITY }}
