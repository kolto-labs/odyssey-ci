# One-time source-owned read-only inventory; no remote writes, execution, or archive extraction.
name: Inventory reviewed archive layout
on:
  push:
    branches: [ci/modsync-key-bootstrap-20261114]
    paths: [.github/workflows/inventory-reviewed-archives.yml]
permissions: {contents: read}
concurrency:
  group: inventory-reviewed-archives
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ github.repository == 'kolto-labs/odyssey-ci' && github.ref == 'refs/heads/ci/modsync-key-bootstrap-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: mod-cache-seed
    steps:
      - name: Checkout exact source tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout exact admitted guide
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kolto-labs/mod-builds
          ref: 67dc5fd8da6abde324c51d32eee3d04687070dd6
          path: guide-input
          persist-credentials: false
      - name: Prepare pinned reader and public-key evidence encryption
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/reviewed-archive-layout/evidence"
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y --no-install-recommends age >/dev/null 2>&1
          python source/tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone" >"$RUNNER_TEMP/reviewed-archive-layout/evidence/reader-bootstrap.log" 2>&1
      - name: Inventory only pinned ZIP metadata and bounded instructions
        id: inventory
        shell: bash
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          umask 077
          python - <<'PY_INVENTORY'
          import contextlib, json, os, shutil, signal, stat, subprocess, sys, tempfile, time, zipfile
          from pathlib import Path, PurePosixPath
          
          EXPECTED = [{'sha256': '56e87873606765efced68a213dc006ababc93fdfbba86b8918cef38827bf4149', 'size': 1095362625, 'extension': 'zip'}, {'sha256': '295a42a537f9cb19e329a8bac458720d0858ced929243d361995ffe3aa0cea77', 'size': 2331082636, 'extension': 'zip'}]
          PIN_ID = '697f63fc224cc4b83aed2f8965d73769a4c18326a50ed2d29bd6e7359ce240c0'
          GUIDE_SHA = '67dc5fd8da6abde324c51d32eee3d04687070dd6'
          base = Path(os.environ['RUNNER_TEMP']) / 'reviewed-archive-layout'
          evidence = base / 'evidence'
          evidence.mkdir(mode=0o700, parents=True, exist_ok=True)
          receipt = {'schema_version': 1, 'source_repository': 'kolto-labs/odyssey-ci',
                     'source_sha': os.environ['GITHUB_SHA'], 'source_run_id': os.environ['GITHUB_RUN_ID'],
                     'source_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'guide_repository': 'kolto-labs/mod-builds', 'guide_sha': GUIDE_SHA,
                     'pin_id': PIN_ID, 'requested_objects': len(EXPECTED), 'status': 'started',
                     'objects': [], 'proof': 'exact-pinned-ZIP metadata and bounded text only; no execution or extraction'}
          
          def save():
              (evidence / 'provenance.json').write_text(json.dumps(receipt, indent=2, sort_keys=True))
          
          def category(exc):
              if isinstance(exc, subprocess.TimeoutExpired):
                  return 'timeout'
              if isinstance(exc, subprocess.CalledProcessError):
                  return 'transfer-failed'
              if isinstance(exc, zipfile.BadZipFile):
                  return 'invalid-zip-or-crc'
              if isinstance(exc, OSError):
                  return 'io-failed'
              if isinstance(exc, (ValueError, KeyError, TypeError, AssertionError)):
                  return 'configuration-or-validation-failed'
              return 'internal-failed'
          
          def stop(signum, frame):
              raise InterruptedError('terminated')
          
          for signum in (signal.SIGINT, signal.SIGTERM):
              signal.signal(signum, stop)
          save()
          work = Path(tempfile.mkdtemp(prefix='private-', dir=base))
          text_left = 256 * 1024
          verified = 0
          try:
              if (os.environ['GITHUB_REPOSITORY'] != 'kolto-labs/odyssey-ci'
                      or os.environ['GITHUB_REF'] != 'refs/heads/ci/modsync-key-bootstrap-20261114'):
                  raise ValueError('source scope mismatch')
              if subprocess.check_output(['git', '-C', 'source', 'rev-parse', 'HEAD'], text=True).strip() != receipt['source_sha']:
                  raise ValueError('source identity mismatch')
              if subprocess.check_output(['git', '-C', 'guide-input', 'rev-parse', 'HEAD'], text=True).strip() != GUIDE_SHA:
                  raise ValueError('guide identity mismatch')
              sys.path.insert(0, str(Path('source/tools/modsync-ci').resolve()))
              with open(os.devnull, 'w') as quiet, contextlib.redirect_stdout(quiet), contextlib.redirect_stderr(quiet):
                  import seed_archives as seed
              receipt['guide_sha256'] = {game: seed.cache.digest(Path('guide-input/content') / game / 'full.md')
                                         for game in ('k1', 'k2')}
              pins = seed.load_pins(seed.DEFAULT_PINS)
              pin = pins[PIN_ID]
              if [{k:o[k] for k in ('sha256','size','extension')} for o in pin['objects']] != EXPECTED:
                  raise ValueError('reviewed pin drift')
              items = {item['id']: item for item in seed.cache.discover(['guide-input/content/k2/full.md'])}
              if items[PIN_ID]['url'] != pin['url']:
                  raise ValueError('guide association changed')
              configured = {name: bool(os.environ.get(name)) for name in (
                  'RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID', 'RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY',
                  'RCLONE_CONFIG_MODCACHE_ENDPOINT', 'MOD_CACHE_BUCKET')}
              receipt['credential_availability'] = configured
              if os.environ.get('MOD_CACHE_BUCKET') != 'modsync-mod-cache' or not all(configured.values()):
                  raise ValueError('source read configuration unavailable')
              # Existing same-backend writer credentials are used only for object GETs.
              original_rclone = seed.refresh.rclone
              def bounded_rclone(*args, timeout=600):
                  return original_rclone(*args, timeout=min(timeout, 1200))
              seed.refresh.rclone = bounded_rclone
              for number, obj in enumerate(pin['objects']):
                  row = {'sha256': obj['sha256'], 'expected_size': obj['size'], 'status': 'started'}
                  receipt['objects'].append(row)
                  local = work / ('archive-' + str(number) + '.zip')
                  try:
                      if obj['size'] + seed.refresh.RESERVE >= shutil.disk_usage(work).free:
                          raise ValueError('insufficient local scratch space')
                      row['stage'] = 'read-exact-source-object'
                      with open(os.devnull, 'w') as quiet, contextlib.redirect_stdout(quiet), contextlib.redirect_stderr(quiet):
                          ok = seed.refresh.fetch('MODCACHE:modsync-mod-cache/modsync-archives/objects/' + obj['sha256'], local,
                                                  '--retries', '1', '--max-transfer', str(obj['size'] + 1), '--cutoff-mode', 'hard')
                      if not ok or not seed.refresh.matches(local, obj['sha256'], obj['size']):
                          raise ValueError('pinned object unavailable or mismatched')
                      row['stage'] = 'zip-metadata-and-bounded-text'
                      inventory = {'object_sha256': obj['sha256'], 'archive_name': obj['archive_name'],
                                   'size': obj['size'], 'members': [], 'texts': [],
                                   'text_member_limit': 65536, 'text_total_limit_all_archives': 262144}
                      names = set()
                      name_bytes = 0
                      with zipfile.ZipFile(local) as archive:
                          infos = archive.infolist()
                          if len(infos) > 100000:
                              raise ValueError('zip member count exceeds bound')
                          for info in infos:
                              name_bytes += len(info.filename.encode('utf-8'))
                              if name_bytes > 4 * 1024 * 1024 or len(info.filename) > 4096 or info.filename in names:
                                  raise ValueError('zip names exceed bound or collide')
                              names.add(info.filename)
                              name = PurePosixPath(info.filename.replace('\\', '/'))
                              unsafe = name.is_absolute() or '..' in name.parts or ':' in info.filename or '\x00' in info.filename
                              mode = info.external_attr >> 16
                              regular = stat.S_IFMT(mode) in (0, stat.S_IFREG)
                              inventory['members'].append({'name': info.filename, 'size': info.file_size,
                                  'compressed_size': info.compress_size, 'crc32': format(info.CRC, '08x'),
                                  'compression': info.compress_type, 'encrypted': bool(info.flag_bits & 1),
                                  'directory': info.is_dir(), 'unsafe_path': unsafe, 'regular_file': regular})
                              suffix = name.suffix.lower()
                              if suffix not in ('.txt', '.md', '.bat') or info.is_dir():
                                  continue
                              if unsafe or not regular or info.flag_bits & 1:
                                  inventory['texts'].append({'name': info.filename, 'status': 'unsafe-or-encrypted-not-read'})
                                  continue
                              limit = min(65536, text_left)
                              if limit <= 0:
                                  inventory['texts'].append({'name': info.filename, 'status': 'total-text-budget-exhausted'})
                                  continue
                              with archive.open(info) as stream:
                                  data = stream.read(min(info.file_size, limit))
                              text_left -= len(data)
                              complete = len(data) == info.file_size
                              inventory['texts'].append({'name': info.filename, 'bytes_read': len(data),
                                  'truncated': not complete, 'crc_verified': complete,
                                  'encoding': 'utf-8-with-replacement', 'text': data.decode('utf-8', errors='replace')})
                      (evidence / ('archive-' + obj['sha256'] + '.json')).write_text(json.dumps(inventory, sort_keys=True))
                      row.update(status='verified-and-inventoried', member_count=len(inventory['members']),
                                 text_member_count=len(inventory['texts']))
                      verified += 1
                  except Exception as exc:
                      row.update(status='failed', failure_category=category(exc))
                  finally:
                      local.unlink(missing_ok=True)
                      save()
              receipt['status'] = 'complete' if verified == len(EXPECTED) else 'incomplete'
          except BaseException as exc:
              receipt['status'] = 'failed'
              receipt['failure_category'] = category(exc)
          finally:
              receipt['verified_objects'] = verified
              receipt['text_bytes_read'] = 262144 - text_left
              save()
              shutil.rmtree(work, ignore_errors=True)
          print(json.dumps({'requested_objects': len(EXPECTED), 'verified_objects': verified, 'status': receipt['status']}, sort_keys=True))
          sys.exit(0 if receipt['status'] == 'complete' else 1)
          PY_INVENTORY
      - name: Encrypt archive metadata and provenance only
        id: evidence
        if: ${{ always() }}
        shell: bash
        env:
          DIAGNOSTICS_ENCRYPTION_RECIPIENT: age1a5ye9zmxelf0fy6qt2t265463ts28kd0z2cjn95fjt9w3vcssvqqg5e4vg
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
        run: |
          set -euo pipefail
          umask 077
          base="$RUNNER_TEMP/reviewed-archive-layout"
          mkdir -p "$base/evidence" "$base/encrypted"
          python - <<'PY_OUTCOME'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-archive-layout' / 'evidence'
          (evidence / 'step-outcome.json').write_text(json.dumps({
              'inventory_outcome': os.environ['INVENTORY_OUTCOME'], 'source_sha': os.environ['GITHUB_SHA'],
              'source_run_id': os.environ['GITHUB_RUN_ID']}, sort_keys=True))
          PY_OUTCOME
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y --no-install-recommends age >/dev/null 2>&1
          fi
          tar -C "$base/evidence" -czf - . | age -r "$DIAGNOSTICS_ENCRYPTION_RECIPIENT" -o "$base/encrypted/archive-layout.tar.gz.age"
          echo "path=$base/encrypted/archive-layout.tar.gz.age" >> "$GITHUB_OUTPUT"
      - name: Upload only encrypted metadata
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-archive-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 7
          if-no-files-found: error
      - name: Remove private source scratch
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY_CLEANUP'
          import os, pathlib, shutil
          shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-archive-layout', ignore_errors=True)
          PY_CLEANUP
