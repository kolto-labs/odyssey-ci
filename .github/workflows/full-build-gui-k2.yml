# Dispatch-only K2 GUI private-controller entry; calls full-build-job.yml
# for the chosen platform/implementation matrix. No ordinary CI caller or schedule.
# Default hosted execution is blocked by that controller; self-hosted execution
# requires valid private configuration. Results/receipts come from the reusable
# controller, with no workflow outputs. This is separate from ci.yml's app lanes.

name: TSL full build (gui)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platforms to execute
        type: choice
        options: [all, windows, linux, macos]
        default: all
      implementation:
        description: Private ModSync implementations to execute
        type: choice
        options: [both, rust, typescript]
        default: both
      runner-mode:
        description: Standard hosted or trusted ephemeral runner
        type: choice
        options: [hosted, self-hosted]
        default: hosted
permissions:
  contents: read
# One run of this lane at a time; a newer dispatch waits instead of competing for the runner.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  full-build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'all' && fromJSON('["windows","linux","macos"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
        implementation: ${{ inputs.implementation == 'both' && fromJSON('["rust","typescript"]') || fromJSON(format('["{0}"]', inputs.implementation)) }}
    uses: ./.github/workflows/full-build-job.yml
    with:
      game: k2
      mode: gui
      platform: ${{ matrix.platform }}
      implementation: ${{ matrix.implementation }}
      runner-mode: ${{ inputs.runner-mode }}
    secrets:
      FULL_BUILD_CONFIG: ${{ secrets.FULL_BUILD_CONFIG }}
      PRIVATE_CI_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
      PRIVATE_CI_RECIPIENT: ${{ secrets.PRIVATE_CI_RECIPIENT }}
      CACHE_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
      CACHE_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
