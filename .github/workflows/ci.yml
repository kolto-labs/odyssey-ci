# Step status guard: success() || failure() overrides implicit success() gating,
# allowing eligible steps after success or failure; it is false when cancelled.
# Existing input/platform/prerequisite predicates still apply. This guard does not
# change workflow concurrency or aggregate failures; failure reporting is separate.
# https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-cancellation
name: CI

# Orchestrate reusable cache workflows and every install lane.
# Caches only make runs faster. A missing cache is refilled; the run fails only
# when a job cannot actually get the game, cannot get a required mod archive from
# any source (cache, P2P, the optional R2 bucket, the website) or finish its install.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'meta.json', 'README.md']
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:
    inputs:
      game_seed_probe:
        description: Restore and cache both game seeds only (no Steam login or install lanes)
        type: boolean
        default: false
      use_steam_guard_codes:
        description: Allow single-use Steam Guard codes on this manual run
        type: boolean
        default: false
      seed_archives:
        description: Seed the archive cache from the staging remote (main only; skips every other job)
        type: boolean
        default: false
      seed_dry_run:
        description: Seed only - verify every staged file against its pin but write nothing to the cache
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Only push (main only), schedule and manual dispatch write the large Actions caches. Pull requests and
  # releases only restore, so a 3 GB game or archive entry is not duplicated per ref and the 10 GB cap holds.
  CACHE_WRITER: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  # ModSync.ts ref the typescript install lanes build. Physical install
  # (--ci-physical-install) exists only on this branch, not on the repository default branch.
  MODSYNC_TS_REF: ${{ vars.MODSYNC_TS_REF || 'feat/physical-install' }}
  # odynsscomp rev the typescript install lanes build the bionsscomp NSS compiler from. Keep it equal to the
  # rev the Rust lanes' Cargo.lock pins.
  # odynsscomp's bionsscomp dev-dependency kotor-ncs-isa still points at the deleted
  # https://github.com/arrenkaetris/kotor-formats (404; its locked commit no longer exists), so the build cannot use
  # --locked and patches that URL to holowan-biolabs/kotor-formats tag v0.1.0. Once odynsscomp repoints the
  # dev-dependency, bump NSSCOMP_REV (with the Rust lanes' lock) and drop the patch.
  NSSCOMP_REV: 00c53a9

# Push, schedule, release and dispatch runs share one group, so two full CI runs never overlap
# (a newer queued run replaces an older queued one; a running one is never cancelled). Pull
# requests queue per PR and a newer commit cancels the older run of the same PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'ci-full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The guards the lanes rely on (coverage, quarantine, receipts, cache verification) are only as good as
  # their unit tests, so run them on every event. Needs no secrets.
  tools:
    name: tools unit tests
    if: ${{ !inputs.seed_archives || inputs.game_seed_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false
      - name: Validate dispatch mode
        if: ${{ success() || failure() }}
        env:
          SEED_ARCHIVES: ${{ inputs.seed_archives }}
          GAME_SEED_PROBE: ${{ inputs.game_seed_probe }}
        run: |
          if [[ "$SEED_ARCHIVES" == true && "$GAME_SEED_PROBE" == true ]]; then
            echo "::error::seed_archives and game_seed_probe are mutually exclusive."
            exit 1
          fi
      - name: Run the tools/modsync-ci unit tests
        if: ${{ success() || failure() }}
        run: |
          # manual.py resolves game paths with PyKotor; its tests need the same pinned version.
          python3 -m pip install --quiet "$(python3 -c 'import sys; sys.path.insert(0, "tools/modsync-ci"); import manual; print(manual.PYKOTOR_REQUIREMENT)')"
          python3 -m unittest discover -s tools/modsync-ci -p 'test_*.py'

  # Fork and dependabot pull requests get no secrets, so they skip every job (install jobs need game).
  game:
    name: game cache
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cache-game.yml
    with:
      cache_writer: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      game_seed_probe: ${{ inputs.game_seed_probe || false }}
      use_steam_guard_codes: ${{ inputs.use_steam_guard_codes || false }}
    secrets: inherit

  mods:
    if: ${{ !inputs.seed_archives && !inputs.game_seed_probe && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cache-archives.yml
    with:
      mode: refresh
      cache_writer: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  artstore-refresh:
    name: artstore refresh
    needs: [mods]
    if: ${{ false && !cancelled() && !inputs.seed_archives && !inputs.game_seed_probe && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cache-archives.yml
    with:
      mode: renew
      cache_writer: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  seed:
    name: seed archive cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_archives && !inputs.game_seed_probe }}
    permissions:
      contents: read
    uses: ./.github/workflows/cache-seed.yml
    with:
      seed_dry_run: ${{ inputs.seed_dry_run || false }}
    secrets: inherit

  p2p-loopback:
    if: ${{ !inputs.seed_archives && !inputs.game_seed_probe && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false

      - name: Resolve ModSync source repository
        if: ${{ success() || failure() }}
        id: source
        env:
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RUST_REPOSITORY" ]]; then
            echo "::error::The repository variable for the rust ModSync source is empty."
            exit 1
          fi
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::MODSYNC_SOURCE_TOKEN is empty."
            exit 1
          fi
          echo "repository=$RUST_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync (rust)
        if: ${{ success() || failure() }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-source
          persist-credentials: false

      - name: Let cargo fetch private git dependencies
        if: ${{ success() || failure() }}
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_TOKEN"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install build tools
        if: ${{ success() || failure() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null

      - name: Build modsync
        if: ${{ success() || failure() }}
        working-directory: .modsync-source
        run: cargo build --locked --bin modsync

      - name: Transfer a random archive between two peers on loopback
        if: ${{ success() || failure() }}
        run: python3 tools/modsync-ci/p2p_loopback.py --binary .modsync-source/target/debug/modsync

  install:
    name: install (${{ matrix.game }}, ${{ matrix.implementation }}, ${{ matrix.mode }})
    needs: [game, mods]
    # Run per game even if the other game failed; unpacking fails if this game is missing.
    if: ${{ !cancelled() && !inputs.game_seed_probe && needs.game.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A job-level block replaces the top-level one, so contents: read is repeated. actions: read lets the
    # artifact-store tier list and download artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
        implementation: [rust, typescript]
        mode: [cli, gui]
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false

      - name: Require the reviewed TypeScript manifest
        if: ${{ (success() || failure()) && (matrix.implementation == 'typescript') }}
        run: |
          review="ci/${GAME}-typescript-review.json"
          if [[ ! -f "$review" ]]; then
            echo "::error::$review is missing. The TypeScript install lanes require a human-reviewed manifest and never pass without one."
            exit 1
          fi
          # A delegated manifest is generated with default patcher answers, not reviewed by hand; say so.
          reviewer=$(jq -r '.reviewer // ""' "$review")
          if [[ "$reviewer" == delegated* ]]; then
            echo "::warning title=manifest not hand-reviewed::$review was generated ($reviewer) with default patcher answers; it is not a human review."
            echo "TypeScript manifest \`$review\` is NOT hand-reviewed: $reviewer" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve ModSync source repository
        if: ${{ success() || failure() }}
        id: source
        env:
          IMPLEMENTATION: ${{ matrix.implementation }}
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
          TYPESCRIPT_REPOSITORY: ${{ vars.MODSYNC_TS_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$IMPLEMENTATION" == rust ]]; then repository="$RUST_REPOSITORY"; else repository="$TYPESCRIPT_REPOSITORY"; fi
          if [[ -z "$repository" ]]; then
            echo "::error::The repository variable for the $IMPLEMENTATION ModSync source is empty."
            exit 1
          fi
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::MODSYNC_SOURCE_TOKEN is empty."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync (${{ matrix.implementation }})
        if: ${{ success() || failure() }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ matrix.implementation == 'typescript' && env.MODSYNC_TS_REF || '' }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-source
          persist-credentials: false

      - name: Restore the NSS script compiler cache
        id: nsscomp
        if: ${{ (success() || failure()) && (matrix.implementation == 'typescript') }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nsscomp
          key: nsscomp-${{ runner.os }}-${{ env.NSSCOMP_REV }}

      - name: Let cargo fetch private git dependencies
        if: ${{ (success() || failure()) && (matrix.implementation == 'rust' || steps.nsscomp.outputs.cache-hit != 'true') }}
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_TOKEN"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Provide the NSS script compiler
        id: provide_nsscomp
        if: ${{ (success() || failure()) && (matrix.implementation == 'typescript') }}
        env:
          CACHE_HIT: ${{ steps.nsscomp.outputs.cache-hit }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nsscomp"
          if [[ "$CACHE_HIT" != true ]]; then
            cargo install --git https://github.com/holowan-biolabs/odynsscomp --rev "$NSSCOMP_REV" \
              --config 'patch."https://github.com/arrenkaetris/kotor-formats".kotor-ncs-isa.git="https://github.com/holowan-biolabs/kotor-formats"' \
              --config 'patch."https://github.com/arrenkaetris/kotor-formats".kotor-ncs-isa.tag="v0.1.0"' \
              bionsscomp-cli --root "$root"
            git config --global --remove-section "url.https://x-access-token:${SOURCE_TOKEN}@github.com/"
          fi
          if [[ ! -x "$root/bin/bionsscomp" ]] || ! "$root/bin/bionsscomp" --version >/dev/null; then
            echo "::error::The NSS script compiler is missing or does not run; TypeScript CompileList steps cannot succeed."
            exit 1
          fi
          echo "MODSYNC_NSS_COMPILER=$root/bin/bionsscomp" >> "$GITHUB_ENV"
          echo "MODSYNC_NSS_GAME=$([[ "$GAME" == k1 ]] && echo 1 || echo 2)" >> "$GITHUB_ENV"

      - name: Save the NSS script compiler cache
        if: ${{ (success() || failure()) && (matrix.implementation == 'typescript' && steps.nsscomp.outputs.cache-hit != 'true' && env.CACHE_WRITER == 'true') && (steps.provide_nsscomp.outcome == 'success') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nsscomp
          key: ${{ steps.nsscomp.outputs.cache-primary-key }}

      - name: Install tools and free disk space
        if: ${{ success() || failure() }}
        run: |
          # The k1 TypeScript CLI lane ran out of disk (ENOSPC) extracting Cutscenes Rescaled
          # (run 39445750831); remove the large preinstalled toolchains no lane uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm /opt/microsoft /opt/az
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
          packages=(p7zip-full pkg-config libssl-dev)
          if [[ '${{ matrix.mode }}' == gui ]]; then
            packages+=(xvfb xauth python3-tk tesseract-ocr tesseract-ocr-eng libxkbcommon-x11-dev
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev)
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}" >/dev/null

      - uses: actions/setup-node@v4
        if: ${{ (success() || failure()) && (matrix.implementation == 'typescript') }}
        with:
          node-version: '22'
      - name: Install ModSync.ts dependencies
        if: ${{ (success() || failure()) && (matrix.implementation == 'typescript') }}
        working-directory: .modsync-source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if [[ '${{ matrix.mode }}' == gui ]]; then corepack pnpm exec playwright install --with-deps chromium; fi
      - name: Install GUI driver
        if: ${{ (success() || failure()) && (matrix.mode == 'gui') }}
        run: |
          python -m pip install --quiet PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          python -c 'import sys, tkinter; print("GUI driver interpreter:", sys.executable, "tk", tkinter.TkVersion)' \
            || { echo "::error::tkinter is not importable by the interpreter that runs gui_rust.py (PyAutoGUI/MouseInfo needs it); python3-tk must match this python."; exit 1; }

      - name: Restore game cache
        if: ${{ success() || failure() }}
        id: game_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          fail-on-cache-miss: ${{ env.CACHE_WRITER == 'true' }}
      - name: Look up game backup artifact
        id: game_backup
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/game_backup.py status --game "$GAME"
      - name: Restore game from backup artifact
        id: game_artifact
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_backup.outputs.artifact_id != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          ARTIFACT_ID: ${{ steps.game_backup.outputs.artifact_id }}
        run: python tools/modsync-ci/game_backup.py fetch --game "$GAME" --artifact-id "$ARTIFACT_ID" --seal-dir "$RUNNER_TEMP/sealed"
      - name: Require the game
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_artifact.outputs.restored != 'true') }}
        run: echo "::error::$GAME has no game cache on this ref and no usable game-$GAME-sealed backup artifact; run the game job from main or a manual dispatch to save it (docs/ci.md, Actions cache size and eviction)"; exit 1
      - name: Explain a game cache miss
        if: ${{ (success() || failure()) && (failure() && steps.game_cache.outcome == 'failure') }}
        run: echo "::error::game cache evicted — re-run the game job (then this lane); see docs/ci.md, Actions cache size and eviction"
      - name: Unpack game
        if: ${{ success() || failure() }}
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
          # Nothing later in this job reads the sealed game; free its space for the install.
          rm -rf -- "$RUNNER_TEMP/sealed"
      - name: Normalize game case
        if: ${{ success() || failure() }}
        run: |
          python tools/modsync-ci/game_cache.py normalize-case --game "$GAME" --game-dir "$RUNNER_TEMP/game" \
            --label "${{ matrix.implementation }} ${{ matrix.mode }}"
      - name: Game inventory
        if: ${{ success() || failure() }}
        run: |
          python tools/modsync-ci/game_cache.py inventory --game "$GAME" --game-dir "$RUNNER_TEMP/game" \
            --label "${{ matrix.implementation }} ${{ matrix.mode }}"
      - name: Install archive tools
        if: ${{ success() || failure() }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
      - name: Restore mod archive cache
        if: ${{ success() || failure() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ needs.mods.outputs.archive_cache_key || 'mod-archives-' }}
          restore-keys: mod-archives-
      - name: Restore required mod archives
        if: ${{ success() || failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          # Reviewed policy skips (docs/ci.md). ports.py leaves the skipped components out of
          # the install: Rust with --deselect, TypeScript with --select of the rest.
          policy=(--allow-uncached-by-policy "Optional Install Assistant - Quicker TSLPatching::Quicker TSLPatching")
          if [[ "$GAME" == k1 ]]; then
            policy+=(--allow-uncached-by-policy "Optional Widescreen & Extended Widescreen Support Mods::Remastered Cutscenes")
          elif [[ "$GAME" == k2 ]]; then
            policy+=(--allow-uncached-by-policy "Enhanced Widescreen Support Mods::K2 Cutscenes Rescaled")
          fi
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          # An archive no source can provide is a warning here, not a failure: the report's
          # unavailable_steps reach ports.py (--restore-report), which deselects those components and
          # their dependents with a warning and installs everything else. Such a lane passes as
          # status "partial" (report omitted_components, a final PARTIAL warning), never "installed";
          # any other component left out fails it (status "incomplete").
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" --report "$RUNNER_TEMP/restore-report.json" \
            --deselect-unavailable "${policy[@]}" "${remote[@]}"
          # The archives are now in $RUNNER_TEMP/archives and this job never saves the archive
          # cache, so drop the sealed copies to leave disk for the install.
          rm -rf -- "$RUNNER_TEMP/mod-cache"

      - name: Install Wine for legacy patchers and Execute
        if: ${{ (success() || failure()) && (matrix.implementation == 'typescript') }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 >/dev/null

      - name: Install the full guide
        if: ${{ success() || failure() }}
        env:
          REVIEW: ci/${{ matrix.game }}-${{ matrix.implementation }}-review.json
          WINEDEBUG: '-all'
          WINEDLLOVERRIDES: 'mscoree,mshtml='
        run: |
          review=(--restore-report "$RUNNER_TEMP/restore-report.json")
          if [[ -f "$REVIEW" ]]; then review+=(--review-manifest "$REVIEW"); fi
          df -h "$RUNNER_TEMP" /
          python tools/modsync-ci/ports.py \
            --implementation '${{ matrix.implementation }}' --mode '${{ matrix.mode }}' \
            --source .modsync-source --guide "content/$GAME/full.md" \
            --game-dir "$RUNNER_TEMP/game" --archives "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" \
            --work-dir "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report.json" "${review[@]}"

      - name: Seal lane diagnostics
        if: ${{ (success() || failure()) && (always()) }}
        env:
          DIAGNOSTICS_ENCRYPTION_KEY: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
        run: |
          if [[ -z "$DIAGNOSTICS_ENCRYPTION_KEY" ]]; then
            echo "::warning::DIAGNOSTICS_ENCRYPTION_KEY is not set; the lane report and convert log are not uploaded."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/diagnostics-plain" "$RUNNER_TEMP/diagnostics"
          if [[ -f "$RUNNER_TEMP/report.json" ]]; then cp -- "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/diagnostics-plain/"; fi
          for log in "$RUNNER_TEMP"/work/ports-*/convert.log; do
            if [[ -f "$log" ]]; then cp -- "$log" "$RUNNER_TEMP/diagnostics-plain/"; fi
          done
          CACHE_ENCRYPTION_KEY="$DIAGNOSTICS_ENCRYPTION_KEY" python tools/modsync-ci/seal.py seal \
            --source "$RUNNER_TEMP/diagnostics-plain" --destination "$RUNNER_TEMP/diagnostics/lane-diagnostics.seal"
      - name: Upload sealed lane diagnostics
        if: ${{ (success() || failure()) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: ports-diagnostics-${{ matrix.game }}-${{ matrix.implementation }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/diagnostics/lane-diagnostics.seal
          retention-days: 7
          if-no-files-found: ignore

  manual:
    name: Legacy JSON reference (${{ matrix.game }})
    needs: [game, mods]
    # Disabled by request: retain the reviewed plans and executor, but do not run this legacy route.
    # The intended AI-driven manual route does not exist yet.
    if: ${{ false && (!cancelled() && !inputs.game_seed_probe && needs.game.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A job-level block replaces the top-level one, so contents: read is repeated. actions: read lets the
    # artifact-store tier list and download artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
    env:
      GAME: ${{ matrix.game }}
      PLAN: ci/${{ matrix.game }}-manual-plan.json
      WINEPREFIX: /home/runner/.wine-modsync
      WINEDEBUG: '-all'
      WINEDLLOVERRIDES: 'mscoree,mshtml='
    steps:
      - uses: actions/checkout@v4
        if: ${{ success() || failure() }}
        with:
          persist-credentials: false
      - name: Require the reviewed manual plan
        if: ${{ success() || failure() }}
        id: plan
        run: |
          if [[ -f "$PLAN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### manual ($GAME)"
              echo "manual lane failed: no reviewed plan, nothing installed; draft attached (artifact \`manual-drafts-$GAME\`). \`$PLAN\` must be authored and reviewed by a human; this lane never passes without installing the game."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Draft the manual plan for review
        if: ${{ (success() || failure()) && (steps.plan.outputs.present == 'false') }}
        run: python3 tools/modsync-ci/draft_plan.py --game "$GAME" --out-dir "$RUNNER_TEMP/drafts"
      - name: Upload manual plan drafts
        if: ${{ (success() || failure()) && (!cancelled() && steps.plan.outputs.present == 'false') }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-drafts-${{ matrix.game }}
          path: ${{ runner.temp }}/drafts
          retention-days: 14
          if-no-files-found: error
      - name: Install Wine and tools, free disk space
        if: ${{ success() || failure() }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 xvfb xauth xdotool imagemagick p7zip-full >/dev/null
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Restore game cache
        if: ${{ success() || failure() }}
        id: game_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          fail-on-cache-miss: ${{ env.CACHE_WRITER == 'true' }}
      - name: Look up game backup artifact
        id: game_backup
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/game_backup.py status --game "$GAME"
      - name: Restore game from backup artifact
        id: game_artifact
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_backup.outputs.artifact_id != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          ARTIFACT_ID: ${{ steps.game_backup.outputs.artifact_id }}
        run: python tools/modsync-ci/game_backup.py fetch --game "$GAME" --artifact-id "$ARTIFACT_ID" --seal-dir "$RUNNER_TEMP/sealed"
      - name: Require the game
        if: ${{ (success() || failure()) && (steps.game_cache.outputs.cache-matched-key == '' && steps.game_artifact.outputs.restored != 'true') }}
        run: echo "::error::$GAME has no game cache on this ref and no usable game-$GAME-sealed backup artifact; run the game job from main or a manual dispatch to save it (docs/ci.md, Actions cache size and eviction)"; exit 1
      - name: Explain a game cache miss
        if: ${{ (success() || failure()) && (failure() && steps.game_cache.outcome == 'failure') }}
        run: echo "::error::game cache evicted — re-run the game job (then this lane); see docs/ci.md, Actions cache size and eviction"
      - name: Unpack game
        if: ${{ success() || failure() }}
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
      - name: Game inventory
        if: ${{ success() || failure() }}
        run: |
          python tools/modsync-ci/game_cache.py inventory --game "$GAME" --game-dir "$RUNNER_TEMP/game" --label manual
      - name: Install archive tools
        if: ${{ success() || failure() }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
      - name: Restore mod archive cache
        if: ${{ success() || failure() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ needs.mods.outputs.archive_cache_key || 'mod-archives-' }}
          restore-keys: mod-archives-
      - name: Restore required mod archives
        if: ${{ success() || failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          mkdir -p "$RUNNER_TEMP/evidence"
          # The same reviewed uncached-by-policy links as the install lanes; all are outside the Mod List.
          policy=(--allow-uncached-by-policy "Optional Install Assistant - Quicker TSLPatching::Quicker TSLPatching")
          if [[ "$GAME" == k1 ]]; then
            policy+=(--allow-uncached-by-policy "Optional Widescreen & Extended Widescreen Support Mods::Remastered Cutscenes")
          elif [[ "$GAME" == k2 ]]; then
            policy+=(--allow-uncached-by-policy "Enhanced Widescreen Support Mods::K2 Cutscenes Rescaled")
          fi
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/evidence/archive-map.json" "${policy[@]}" "${remote[@]}"
      # Evidence for authoring and checking the plan: archive and member hashes, shipped patchers and
      # their configuration. Mod metadata only; no game files.
      - name: Inventory the restored archives
        if: ${{ success() || failure() }}
        run: |
          python tools/modsync-ci/manual_inventory.py --archives "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/evidence/archive-map.json" --out "$RUNNER_TEMP/evidence/inventory.json"
      - name: Probe the original patchers under Wine
        if: ${{ (success() || failure()) && (steps.plan.outputs.present == 'false') }}
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/modsync-ci/manual_probe.py \
            --inventory "$RUNNER_TEMP/evidence/inventory.json" --archives "$RUNNER_TEMP/archives" \
            --out "$RUNNER_TEMP/evidence/probe"
      - name: Upload manual plan evidence
        if: ${{ (success() || failure()) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-evidence-${{ matrix.game }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: ignore
      - name: Fail without a reviewed plan
        if: ${{ (success() || failure()) && (steps.plan.outputs.present == 'false') }}
        run: echo "::error title=manual lane installed nothing::$PLAN is missing. The manual lane needs a reviewed, Wine-executed plan; a draft is attached as manual-drafts-$GAME and the archive evidence as manual-evidence-$GAME."; exit 1
      - name: Install the full guide manually with the original patchers
        if: ${{ (success() || failure()) && (steps.plan.outputs.present == 'true') }}
        run: |
          # manual.py resolves game paths case-insensitively with PyKotor (PYKOTOR_REQUIREMENT).
          python -m pip install --quiet "$(python -c 'import sys; sys.path.insert(0, "tools/modsync-ci"); import manual; print(manual.PYKOTOR_REQUIREMENT)')"
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/modsync-ci/manual.py --plan "$PLAN" \
            --guide "content/$GAME/full.md" --game-dir "$RUNNER_TEMP/game" \
            --archives "$RUNNER_TEMP/archives" --work-dir "$RUNNER_TEMP/work" \
            --report "$RUNNER_TEMP/report.json"
      - name: Upload manual lane report
        if: ${{ (success() || failure()) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-report-${{ matrix.game }}
          path: ${{ runner.temp }}/report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Collect manual lane step diagnostics
        if: ${{ (success() || failure()) && (always() && steps.plan.outputs.present == 'true') }}
        run: |
          # manual.py keeps per step work/step-NNNN/: operations.log (operations, patcher output,
          # [gui_patcher] window names), gui-failure-N.png screenshots and installer-log-N.* (the
          # failed patcher's own log), next to before/ (game snapshot) and before.json/after.json
          # (full game manifests). Only the top-level small files are copied, never the snapshot,
          # the manifests or work/extract. manual.py runs as this user, so its 0700/0600 files are readable.
          out="$RUNNER_TEMP/manual-diagnostics"
          mkdir -p "$out"
          [ -d "$RUNNER_TEMP/work" ] || exit 0
          for step in "$RUNNER_TEMP"/work/step-*/; do
            [ -d "$step" ] || continue
            name=$(basename "$step")
            find "$step" -mindepth 1 -maxdepth 1 -type f -size -16M \
              ! -name before.json ! -name after.json \
              -exec install -D -m 0644 -t "$out/$name" {} +
          done
          du -sh "$out" || true
      - name: Upload manual lane step diagnostics
        if: ${{ (success() || failure()) && (always() && steps.plan.outputs.present == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-diagnostics-${{ matrix.game }}
          path: ${{ runner.temp }}/manual-diagnostics
          retention-days: 14
          if-no-files-found: ignore
