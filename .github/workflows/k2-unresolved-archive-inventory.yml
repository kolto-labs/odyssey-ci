name: Inventory exact K2 unresolved binding archives
'on':
  push:
    branches:
    - ci/modsync-key-bootstrap-20261114
    paths:
    - .github/workflows/k2-unresolved-archive-inventory.yml
permissions:
  contents: read
concurrency:
  group: k2-unresolved-archive-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ github.repository == 'kolto-labs/odyssey-ci' && github.ref == 'refs/heads/ci/modsync-key-bootstrap-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: mod-cache-seed
    steps:
    - name: Checkout pinned source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: kolto-labs/odyssey-ci
        ref: 3045420a6082d82c7b39ccf58351e1704392439d
        path: source
        persist-credentials: false
    - name: Checkout pinned engine
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: kolto-labs/ModSync.rs
        ref: 32fd39ba12c489245b1cabb0e4d064d559a021b9
        path: engine
        persist-credentials: false
    - name: Checkout pinned guide
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: kolto-labs/mod-builds
        ref: 67dc5fd8da6abde324c51d32eee3d04687070dd6
        path: guide-input
        persist-credentials: false
    - name: Prepare bounded reader and encryption
      timeout-minutes: 10
      run: |
        set -euo pipefail
        umask 077
        mkdir -p "$RUNNER_TEMP/k2-unresolved-archive-inventory/evidence" "$RUNNER_TEMP/k2-unresolved-archive-inventory/home"
        sudo timeout 300 apt-get -o Acquire::Retries=2 update -qq
        sudo timeout 300 apt-get -o Acquire::Retries=2 install -y --no-install-recommends age 7zip 7zip-rar unrar file innoextract
        python source/tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
    - name: GET only exact reviewed objects
      timeout-minutes: 40
      env:
        RCLONE_CONFIG_MODCACHE_TYPE: s3
        RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
        RCLONE_CONFIG_MODCACHE_REGION: auto
        RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
        RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
        RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
        RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
        MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
