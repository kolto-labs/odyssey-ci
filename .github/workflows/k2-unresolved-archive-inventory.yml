           receipt['fetch_results'].append({'sha256':item['sha256'],'status':'verified','seconds':time.monotonic()-started});save()
          except Exception as exc:
           receipt['fetch_results'].append({'sha256':item['sha256'],'status':'failed','failure_category':type(exc).__name__});save()
         receipt['status']='fetch-complete'
        finally: save()
        PY_FETCH
    - name: Inventory names and bounded text without extraction or execution
      timeout-minutes: 80
      run: |
        umask 077
        python - <<'PY_INVENTORY'
        import hashlib, json, os, re, selectors, signal, subprocess, time
        from pathlib import Path, PurePosixPath
        base=Path(os.environ['RUNNER_TEMP'])/'k2-unresolved-archive-inventory';evidence=base/'evidence'
        receipt=json.loads((evidence/'provenance.json').read_text()); result={'schema':1,'archives':[],'status':'started','failures':0}
        env={'PATH':os.environ['PATH'],'HOME':str(base/'home'),'LC_ALL':'C.UTF-8'}
        def save(): (evidence/'inventory.json').write_text(json.dumps(result,indent=2))
        def capture(args,limit,seconds,allow_failure=False):
         process=subprocess.Popen(args,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,env=env,start_new_session=True)
         output=bytearray();deadline=time.monotonic()+seconds
         try:
          with selectors.DefaultSelector() as selector:
           selector.register(process.stdout,selectors.EVENT_READ)
           while True:
            if time.monotonic()>deadline:raise ValueError('metadata timeout')
            if not selector.select(1):continue
            chunk=os.read(process.stdout.fileno(),min(65536,limit+1-len(output)))
            if not chunk:break
            output.extend(chunk)
            if len(output)>limit:raise ValueError('metadata bound exceeded')
          code=process.wait(timeout=max(.1,deadline-time.monotonic()))
          if not allow_failure:assert code==0,'metadata reader failed'
          return (code,bytes(output)) if allow_failure else bytes(output)
         finally:
          if process.poll() is None:os.killpg(process.pid,signal.SIGKILL)
          process.wait();process.stdout.close()
        listing_left=32*1024**2;text_left=256*1024
        try:
         assert receipt['status']=='fetch-complete' and len(receipt['fetch_results'])==32
         for item in receipt['plan']:
          try:
           assert any(r['sha256']==item['sha256'] and r['status']=='verified' for r in receipt['fetch_results']),'object not verified'
           path=base/'objects'/item['sha256'];started=time.monotonic()
           with path.open('rb') as handle:assert hashlib.file_digest(handle,'sha256').hexdigest()==item['sha256']
           assert path.stat().st_size==item['size']
           if item.get('foundational'):
            row={'sha256':item['sha256'],'component_guid':item['component_guid'],'foundational':True,'proof':'format/listing only; no installation or execution','readers':[]};result['archives'].append(row)
            for reader,args in [('file',['file','-b','--',str(path)]),('7z',['7z','l','-slt','-ba','-bd','-p-','--',str(path)]),('innoextract',['innoextract','--list','--',str(path)])]:
             code,data=capture(args,min(4*1024**2,listing_left),120,True);listing_left-=len(data)
             row['readers'].append({'reader':reader,'exit_code':code,'output':data.decode('utf-8',errors='replace')})
            row['seconds']=time.monotonic()-started;save()
            assert any(x['exit_code']==0 for x in row['readers'] if x['reader'] in ('7z','innoextract')),'installer inventory unavailable'
            continue
           rar=Path(item['archive_name']).suffix.lower()=='.rar'
           command=['unrar','lt','-p-','-c-',str(path)] if rar else ['7z','l','-slt','-ba','-bd','-sccUTF-8','-p-','--',str(path)]
           raw=capture(command,min(4*1024**2,listing_left),120)
           listing_left-=len(raw);text=raw.decode('utf-8',errors='strict')
           row={'sha256':item['sha256'],'component_guid':item['component_guid'],'members':[],'texts':[]};result['archives'].append(row)
           (evidence/(item['sha256']+'.slt.txt')).write_text(text)
           seen=set()
           if rar:
            records=[];fields=None
            for line in text.splitlines():
             match=re.match(r'^\s*(Name|Type|Size|Attributes|Target|Link target):\s*(.*)$',line)
             if not match:continue
             key,value=match.groups()
             if key=='Name':
              fields={};records.append(fields)
             if fields is not None:
              assert key not in fields,'duplicate RAR listing field';fields[key]=value
           else:
            records=[]
            for block in re.split(r'\r?\n\s*\r?\n',text.strip('\r\n')):
             fields={}
             for line in block.splitlines():
              assert ' = ' in line,'ambiguous listing';key,value=line.split(' = ',1);assert key not in fields;fields[key]=value
             records.append(fields)
           for fields in records:
            name=fields.get('Name' if rar else 'Path');assert name and name not in seen and len(name)<=4096;seen.add(name);assert len(seen)<=100000
            norm=PurePosixPath(name.replace('\\','/'));size=int(fields.get('Size','0'));assert size>=0
            unsafe=norm.is_absolute() or '..' in norm.parts or ':' in name or any(ord(c)<32 for c in name)
            kind=fields.get('Type','').lower()
            directory=kind=='directory' if rar else fields.get('Folder')=='+' or fields.get('Attributes','').startswith('D')
            link=(rar and kind not in ('file','directory')) or any('link' in key.casefold() or key=='Target' for key in fields) or bool(re.search(r'(?:^|\s)l[rwx-]{9}',fields.get('Attributes','')))
            row['members'].append({'name':name,'size':size,'directory':directory,'link':link,'unsafe_path':unsafe,'encrypted':fields.get('Encrypted')=='+','attributes':fields})
           assert row['members'],'empty listing'
           for member in row['members']:
            name=PurePosixPath(member['name'].replace('\\','/'));lower=name.name.lower()
            approved=lower in ('changes.ini','namespaces.ini') or (lower.startswith('readme') and name.suffix.lower() in ('.txt','.md'))
            if not approved or member['directory'] or member['link'] or member['unsafe_path'] or member['encrypted']:continue
            if len(row['texts'])>=4 or not 0<member['size']<=min(65536,text_left):continue
            if rar and any(c in member['name'] for c in '*?[]'):continue
            command=['unrar','p','-inul','-p-','-c-',str(path),member['name']] if rar else ['7z','x','-so','-bd','-sccUTF-8','-p-','-spd','--',str(path),member['name']]
            data=capture(command,min(65536,text_left),120)
            assert len(data)==member['size'];text_left-=len(data)
            row['texts'].append({'name':member['name'],'sha256':hashlib.sha256(data).hexdigest(),'text':data.decode('utf-8',errors='replace')})
           row['seconds']=time.monotonic()-started;save()
          except Exception as exc:
           result['failures']+=1
           row=next((r for r in result['archives'] if r['sha256']==item['sha256']),None)
           if row is None:
            row={'sha256':item['sha256'],'component_guid':item['component_guid']};result['archives'].append(row)
           row.update(status='failed',failure_category=type(exc).__name__);save()
         assert len(result['archives'])==32
         result['status']='complete' if not result['failures'] else 'complete-with-failures'
        finally:save()
        if result['failures']:raise SystemExit(1)
        PY_INVENTORY
